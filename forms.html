<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program WEB | Forms</title>
</head>
<body>
    <h1>Ejercicio con formularios en HTML 5</h1>

    <form action="" method="post">
    <!--<label for="nombre">Usuario</label>-->
    <input type="text" name="nombre" id="nombre" maxlength="10" minlength="3" placeholder="Escribe tu nombre">
        <br>
    <label for="ap_paterno">Apellido Paterno</label>
    <input type="text" name="ap_paterno" id="ap_paterno" required >
        <br>
    <label for="ap_materno">Apellido materno</label>
    <input type="text" name="ap_Materno" id="ap_Materno">
        <br>
    <label for="edad">Edad</label>
    <input type="number" name="edad" id="edad" style="width: 30px;">
        <br>
    <label for="correo">Correo</label>
    <input type="email" name="correo" id="correo">
        <br>
    <label for="fecha">Fecha</label>
    <input type="date" name="fecha" id="fecha">
        <br>
    <label for="color">Color</label>
    <input type="color" name="color" id="color">
        <br>
    <label for="url">URL</label>
    <input type="url" name="url" id="url">
        <br>
    <label for="password">Contraseña</label>
    <input type="password" name="password" id="password">
    <br>
    <label for="hobbie">Hobbies</label> <br>
    <input type="checkbox" name="hobbie" id="hobbie" value="programar"> Programar <br>
    <input type="checkbox" name="hobbie" id="hobbie" value="leer"> Leer <br>
    <input type="checkbox" name="hobbie" id="hobbie" value="correr"> Correr <br>
    <input type="checkbox" name="hobbie" id="hobbie" value="jugar"> Jugar <br>
    <br>
    <input type="range" name="" id="">
    <br>
    <label for="estado">Estado</label>
    <select name="estado" id="estado">
        <option value="Jalisco">Jalisco</option>
        <option value="Zacatecas">Zacatecas</option>
    </select>
    <br>


    <input type="submit" value="Registrar">
    
    </form>

    
</body>
</html>
